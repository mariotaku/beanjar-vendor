version = 1
SPDX-PackageName = "beanjar-vendor"
SPDX-PackageDownloadLocation = "https://github.com/mariotaku/beanjar-vendor"

# Build scripts and workflows carry their own SPDX header. The entries below cover what cannot:
# documentation, versions, notices, source checksums and patches, which carry the licence
# Beanjar gives them.
[[annotations]]
path = [
  "**.md",
  ".gitignore",
  "qemu/VERSION",
  "qemu/qemu.sha256",
  "qemu/NOTICE",
  "qemu/patches/**.patch",
  "neatvnc/VERSION",
  "neatvnc/neatvnc.sha256",
  "neatvnc/NOTICE",
  "ffmpeg/VERSION",
  "ffmpeg/ffmpeg.sha256",
  "ffmpeg/NOTICE",
  "angle/VERSION",
  "angle/sources",
  "angle/NOTICE",
  "virglrenderer/VERSION",
  "virglrenderer/sources",
  "virglrenderer/NOTICE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Mariotaku <git@mariotaku.me> and the Beanjar contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# The neatvnc patches change neatvnc's ISC-licensed code and carry its licence.
[[annotations]]
path = "neatvnc/patches/**.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = "Mariotaku <git@mariotaku.me> and the Beanjar contributors"
SPDX-License-Identifier = "ISC"

# The libepoxy patch changes libepoxy's MIT-licensed code and carries its licence.
[[annotations]]
path = "virglrenderer/patches/libepoxy/**.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = "Mariotaku <git@mariotaku.me> and the Beanjar contributors"
SPDX-License-Identifier = "MIT"

# The virglrenderer patches are its open merge requests !1713 to !1719, by the author each names;
# they change virglrenderer's MIT-licensed code and carry its licence.
[[annotations]]
path = "virglrenderer/patches/virglrenderer/**.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = "The authors named in each patch"
SPDX-License-Identifier = "MIT"
