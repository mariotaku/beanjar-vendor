version = 1
SPDX-PackageName = "beanjar-vendor"
SPDX-PackageDownloadLocation = "https://github.com/mariotaku/beanjar-vendor"

# Build scripts and workflows carry their own SPDX header. The entries below cover what cannot:
# documentation, Debian control data, source checksums and patches, which carry the licence
# Beanjar gives them.
[[annotations]]
path = [
  "**.md",
  ".gitignore",
  "qemu/qemu.sha256",
  "qemu/debian/**",
  "qemu/patches/**.patch",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Mariotaku <git@mariotaku.me> and the Beanjar contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"
