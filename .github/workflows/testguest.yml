# SPDX-License-Identifier: GPL-2.0-or-later
# Build the test guest userland (a 32-bit ARM root filesystem and its sysroot, and
# Buildroot's legal-info) with testguest/build.sh in a debian:trixie container on amd64. Buildroot's
# downloads and ccache are kept between runs. Every run uploads the tarballs as the artifact
# beanjar-testguest-armel. Pushing a tag testguest-<version>, where <version> is testguest/VERSION,
# also publishes them as a GitHub release with a SHA256SUMS file.
name: testguest

on:
  # Buildroot takes 25 to 40 minutes and the userland rarely changes, so it builds for a release
  # (the tag) and on request (workflow_dispatch, e.g. on a branch before tagging), not on every push.
  push:
    tags:
      - "testguest-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testguest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: testguest (armel)
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 240
    env:
      BR2_DL_DIR: ${{ github.workspace }}/build/cache/dl
      BR2_CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cat testguest/VERSION)
          if [ "$TAG" != "testguest-$version" ]; then
            echo "tag $TAG does not match testguest/VERSION ($version)" >&2
            exit 1
          fi
      # Buildroot's downloads, by the files that pin them
      - name: Buildroot downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/dl
          key: testguest-dl-${{ hashFiles('testguest/buildroot.sha256', 'testguest/defconfig') }}
          restore-keys: testguest-dl-
      # ccache's directory changes with every build: saved under the run, the newest one restored
      - name: Buildroot ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/cache/ccache
          key: testguest-ccache-${{ github.run_id }}
          restore-keys: testguest-ccache-
      - name: Build
        run: sh testguest/build.sh "$GITHUB_WORKSPACE/build/testguest"
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-testguest-armel
          path: |
            build/testguest/testguest-*-armel.tar.xz
            build/testguest/testguest-*-legal-info.tar
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: beanjar-testguest-armel
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          version=${TAG#testguest-}
          set -- "testguest-$version-armel.tar.xz" "testguest-$version-legal-info.tar"
          for f in "$@"; do
            [ -f "$f" ] || { echo "missing $f" >&2; ls -l; exit 1; }
          done
          sha256sum "$@" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "The test guest userland (armel root filesystem, and sysroot) and its legal-info, built by testguest/build.sh; see testguest/README.md." \
            "$@" SHA256SUMS
