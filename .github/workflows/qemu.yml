# SPDX-FileCopyrightText: Mariotaku <git@mariotaku.me> and the Beanjar contributors
# SPDX-License-Identifier: GPL-2.0-or-later
# Build the QEMU tarball (Beanjar's patched qemu-system-aarch64, its vhost-user-gpu and QEMU's
# data directory) for amd64 and arm64, each natively in a debian:trixie container, with
# qemu/build.sh. Pushes and pull requests that touch qemu/ or this workflow only check that it
# builds; a manual run uploads the tarballs as workflow artifacts. Pushing a tag qemu-<version>,
# where <version> is qemu/VERSION, builds both and publishes them as a GitHub release, with the
# upstream QEMU tarball and a SHA256SUMS file.
name: QEMU

on:
  push:
    branches:
      - "**"
    tags:
      - "qemu-*"
    # path filters are not evaluated for tags
    paths:
      - "qemu/**"
      - ".github/workflows/qemu.yml"
  pull_request:
    paths:
      - "qemu/**"
      - ".github/workflows/qemu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: qemu (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cat qemu/VERSION)
          if [ "$TAG" != "qemu-$version" ]; then
            echo "tag $TAG does not match qemu/VERSION ($version)" >&2
            exit 1
          fi
      - name: Build
        run: sh qemu/build.sh "$GITHUB_WORKSPACE/build/qemu"
      - name: Upload
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-qemu-${{ matrix.arch }}
          path: build/qemu/qemu-*-${{ matrix.arch }}.tar.xz
          if-no-files-found: error
      - name: Upload the source
        if: matrix.arch == 'amd64' && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-qemu-source
          path: build/qemu/qemu-[0-9]*.[0-9].tar.xz
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: beanjar-qemu-*
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          version=${TAG#qemu-}
          upstream=${version%%+beanjar*}
          set -- "qemu-$version-amd64.tar.xz" "qemu-$version-arm64.tar.xz" "qemu-$upstream.tar.xz"
          for f in "$@"; do
            [ -f "$f" ] || { echo "missing $f" >&2; ls -l; exit 1; }
          done
          sha256sum "$@" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "QEMU $version with Beanjar's patches, for Debian 13 (amd64, arm64), built by qemu/build.sh; see qemu/README.md. The QEMU tarball is the source, with the patches in this tag." \
            "$@" SHA256SUMS
