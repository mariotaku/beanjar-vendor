# SPDX-License-Identifier: GPL-2.0-or-later
# Build the ffmpeg-helper tarball (the media helper's FFmpeg, its decoders only, under
# /usr/lib/beanjar/ffmpeg-helper) for amd64 and arm64, each natively in a debian:trixie container,
# with ffmpeg-helper/build.sh. Pushes and pull requests that touch ffmpeg-helper/, the FFmpeg
# source and patches it shares with ffmpeg/, or this workflow only check that it builds; a manual
# run uploads the tarballs as workflow artifacts. Pushing a tag ffmpeg-helper-<version>, where
# <version> is ffmpeg-helper/VERSION, builds both and publishes them as a GitHub release, with the
# patched source and a SHA256SUMS file.
name: FFmpeg helper

on:
  push:
    branches:
      - "**"
    tags:
      - "ffmpeg-helper-*"
    # path filters are not evaluated for tags
    paths:
      - "ffmpeg-helper/**"
      - "ffmpeg/sources.sh"
      - "ffmpeg/ffmpeg.sha256"
      - "ffmpeg/patches/**"
      - ".github/workflows/ffmpeg-helper.yml"
  pull_request:
    paths:
      - "ffmpeg-helper/**"
      - "ffmpeg/sources.sh"
      - "ffmpeg/ffmpeg.sha256"
      - "ffmpeg/patches/**"
      - ".github/workflows/ffmpeg-helper.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ffmpeg-helper (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cat ffmpeg-helper/VERSION)
          if [ "$TAG" != "ffmpeg-helper-$version" ]; then
            echo "tag $TAG does not match ffmpeg-helper/VERSION ($version)" >&2
            exit 1
          fi
      - name: Build
        run: sh ffmpeg-helper/build.sh "$GITHUB_WORKSPACE/build/ffmpeg-helper"
      - name: Upload
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-ffmpeg-helper-${{ matrix.arch }}
          path: build/ffmpeg-helper/ffmpeg-helper-*-${{ matrix.arch }}.tar.xz
          if-no-files-found: error
      - name: Upload the source
        if: matrix.arch == 'amd64' && (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-ffmpeg-helper-source
          path: build/ffmpeg-helper/ffmpeg-helper-*-source.tar.xz
          if-no-files-found: error

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: beanjar-ffmpeg-helper-*
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          version=${TAG#ffmpeg-helper-}
          set -- "ffmpeg-helper-$version-amd64.tar.xz" "ffmpeg-helper-$version-arm64.tar.xz" "ffmpeg-helper-$version-source.tar.xz"
          for f in "$@"; do
            [ -f "$f" ] || { echo "missing $f" >&2; ls -l; exit 1; }
          done
          sha256sum "$@" > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "FFmpeg for Beanjar's media helper: its decoders, parsers and VA-API, Vulkan, NVDEC and V4L2 request hardware decoding only, for Debian 13 (amd64, arm64), built by ffmpeg-helper/build.sh; see ffmpeg-helper/README.md." \
            "$@" SHA256SUMS
