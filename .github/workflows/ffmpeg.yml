# SPDX-License-Identifier: GPL-2.0-or-later
# Build the FFmpeg tarball for amd64 and arm64, each natively in a debian:trixie container, with
# ffmpeg/build.sh. Pushes and pull requests that touch ffmpeg/ or this workflow only check that it
# builds; a manual run uploads the tarballs as workflow artifacts. Pushing a tag
# ffmpeg-<version>, which must match ffmpeg/VERSION, also publishes them as a GitHub release
# with the patched source and a SHA256SUMS file.
name: FFmpeg

on:
  push:
    branches:
      - "**"
    tags:
      - "ffmpeg-*"
    # not evaluated for tags
    paths:
      - "ffmpeg/**"
      - ".github/workflows/ffmpeg.yml"
  pull_request:
    paths:
      - "ffmpeg/**"
      - ".github/workflows/ffmpeg.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg:
    name: beanjar-ffmpeg (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against ffmpeg/VERSION
        if: github.ref_type == 'tag'
        run: test "ffmpeg-$(cat ffmpeg/VERSION)" = "$GITHUB_REF_NAME"
      - name: Build
        run: sh ffmpeg/build.sh "$GITHUB_WORKSPACE/build/ffmpeg"
      - name: Upload
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beanjar-ffmpeg-${{ matrix.arch }}
          path: build/ffmpeg/ffmpeg-*.tar.xz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: ffmpeg
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: beanjar-ffmpeg-*
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          version=${GITHUB_REF_NAME#ffmpeg-}
          for f in "ffmpeg-$version-amd64.tar.xz" "ffmpeg-$version-arm64.tar.xz" "ffmpeg-$version-source.tar.xz"; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          sha256sum ffmpeg-*.tar.xz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag \
            --notes "FFmpeg $version with the V4L2 Request API hwaccels, for Debian 13. See ffmpeg/README.md." \
            ffmpeg-*.tar.xz SHA256SUMS
